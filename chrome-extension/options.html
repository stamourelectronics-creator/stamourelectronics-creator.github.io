<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IsaiahAI Settings</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101114;color:#f4f4f5}body{margin:0;padding:28px;max-width:680px}h1{font-size:24px;margin:0 0 8px}p{color:#a1a1aa;line-height:1.6;font-size:14px}.card{padding:20px;border:1px solid #33343a;border-radius:16px;background:#191a1f}label{display:block;font-size:13px;margin:18px 0 8px}input{display:block;width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #41424a;background:#090a0d;color:white;font:inherit}button{margin-top:12px;padding:11px 16px;border:0;border-radius:10px;background:#fbbf24;color:#161616;font-weight:800;cursor:pointer}#status{font-size:12px;color:#fcd34d;min-height:20px;margin-top:10px}.note{font-size:12px;color:#71717a}
  </style>
</head>
<body>
  <h1>IsaiahAI</h1>
  <p>Choose which IsaiahAI website should answer questions about the pages you open. Page context is shared with that website only when you ask IsaiahAI a question.</p>
  <div class="card">
    <label for="apiBase">IsaiahAI website URL</label>
    <input id="apiBase" type="url" placeholder="https://your-isaiahai-site.netlify.app">
    <button id="save" type="button">Save website URL</button>
    <div id="status" role="status"></div>
    <p class="note">Enter the base website URL, not a path ending in /api. The extension will add /api/site-assist automatically.</p>
  </div>
  <script src="options.js"></script>
</body>
</html>
