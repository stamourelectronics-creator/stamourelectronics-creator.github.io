[build]
  command = "node scripts/build-netlify-site.mjs"
  ignore = "node scripts/netlify-ignore-build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route API calls to the dynamic Netlify function before the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Keep website paths working after a refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
