[build]
  command = "node scripts/build-netlify-site.mjs"
  ignore = "node scripts/netlify-ignore-build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The Netlify function declares config.path = '/api/*' directly.
# Do not rewrite /api/* to /.netlify/functions/api/:splat: custom-path
# functions are only served at config.path, not the default function URL.

# Keep website paths working after a refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
