name: IsaiahAI SUPER and Google Auth Checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "chrome-extension/**"
      - "electron-agent/**"
      - "public/mobile/**"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/isaiah-super-google-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site and verify Google auth wiring
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check the full frontend
        run: npm run lint
      - name: Syntax-check extension, mobile, and desktop JavaScript
        run: |
          node --check chrome-extension/service_worker.js
          node --check chrome-extension/content.js
          node --check chrome-extension/popup.js
          node --check chrome-extension/options.js
          node --check public/mobile/sw.js
          node --check electron-agent/main.cjs
          node --check electron-agent/preload.cjs
          node --check electron-agent/scripts/check-renderer.cjs
          node --check electron-agent/scripts/write-update-manifest.cjs
      - name: Build GitHub Pages site
        run: npm run build:pages
      - name: Verify Google sign-in separation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const firebase = fs.readFileSync('src/firebase.ts', 'utf8');
          const firebaseConfig = JSON.parse(fs.readFileSync('src/firebase-applet-config.json', 'utf8'));
          const rootFirebaseConfig = JSON.parse(fs.readFileSync('firebase-applet-config.json', 'utf8'));
          const mobileHtml = fs.readFileSync('public/mobile/index.html', 'utf8');
          const desktopHtml = fs.readFileSync('electron-agent/index.html', 'utf8');
          const mobileSource = fs.readFileSync('public/mobile/index.html', 'utf8');
          const desktopScriptStart = desktopHtml.lastIndexOf('<script>');
          const desktopScriptEnd = desktopHtml.lastIndexOf('</script>');
          assert.ok(desktopScriptStart >= 0 && desktopScriptEnd > desktopScriptStart, 'desktop inline app script must exist');
          const desktopScript = desktopHtml.slice(desktopScriptStart + 8, desktopScriptEnd);
          const docs = fs.readFileSync('src/components/SchoolDocSyncModal.tsx', 'utf8');
          const puter = fs.readFileSync('src/lib/puterClient.ts', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const logo = fs.readFileSync('src/components/BrandLogo.tsx', 'utf8');
          assert.match(app, /user\.isAnonymous\s*\?\s*null\s*:\s*user/, 'anonymous sessions must not masquerade as Google logins');
          assert.match(app, /linkWithPopup\(activeUser,\s*provider\)/, 'anonymous users must be linkable to Google');
          assert.match(app, /getRedirectResult\(auth\)/, 'redirect sign-in results must be handled');
          assert.match(app, /Firebase rejected Google sign-in for this origin/, 'Google auth errors must expose the active project/origin diagnostics');
          assert.match(firebase, /const googleProvider = new GoogleAuthProvider\(\);/, 'basic Google account provider is missing');
          assert.match(firebase, /const googleWorkspaceProvider = new GoogleAuthProvider\(\);/, 'on-demand Workspace provider is missing');
          assert.match(firebase, /from '\.\/firebase-applet-config\.json'/, 'the active Firebase config import is missing');
          assert.deepEqual(firebaseConfig, {
            projectId: 'isaiahsi',
            appId: '1:791614054722:web:feabd277ccdd97516a28db',
            apiKey: 'AIzaSyCF51HZqBXNnflJsbw8XDqYEH9f7276eLA',
            authDomain: 'isaiahsi.firebaseapp.com',
            storageBucket: 'isaiahsi.firebasestorage.app',
            messagingSenderId: '791614054722',
            measurementId: 'G-XC2C9C1NM3'
          }, 'website Firebase config must match the supplied IsaiahSI project');
          assert.deepEqual(rootFirebaseConfig, firebaseConfig, 'root fallback config must stay aligned with the website config');
          assert.match(mobileHtml, /\"projectId\"\s*:\s*\"isaiahsi\"/, 'mobile app must use IsaiahSI Firebase');
          assert.match(desktopHtml, /\"projectId\"\s*:\s*\"isaiahsi\"/, 'Windows desktop app must use IsaiahSI Firebase');
          for (const [name, html] of [['mobile', mobileHtml], ['desktop', desktopHtml]]) {
            assert.match(html, /"authDomain"\s*:\s*"isaiahsi\.firebaseapp\.com"/, name + ' auth domain is outdated');
            assert.match(html, /\"apiKey\"\s*:\s*\"AIzaSyCF51HZqBXNnflJsbw8XDqYEH9f7276eLA\"/, name + ' API key is outdated');
            assert.match(html, /\"appId\"\s*:\s*\"1:791614054722:web:feabd277ccdd97516a28db\"/, name + ' app ID is outdated');
            assert.doesNotMatch(html, /continual-processor-sk4jk|gen-lang-client-0837934328|bionic-argon-qrtgb/, name + ' still references an old Firebase project');
          }
          assert.match(docs, /onGoogleSignIn: \(\) => Promise<string \| null>/, 'Docs must use the shared Workspace sign-in flow');
          assert.match(puter, /authenticateWithPuter/, 'Puter UI sign-in dialog fallback is missing');
          assert.match(puter, /auth\.signIn\(\{ request_auth: true \}\)/, 'Puter popup fallback is missing');
          assert.match(index, /js\.puter\.com\/v2\/" defer/, 'Puter SDK should load before users can open Image Studio');
          assert.match(logo, /src="\/isaiahai-logo\.svg"/, 'all app logos must use the deployed public logo asset');
          assert.match(app, /requestPhase !== 'complete'/, 'completed model streams must hide the writing indicator');
          assert.match(app, /const hasImageAttachments =/, 'web chat must detect image attachments before routing prompts');
          assert.match(app, /images: currentUploaded\.filter\(img => img\.mimeType\.startsWith\('image\/'\)\)/, 'web chat must send only images to the multimodal gateway');
          assert.match(app, /remainingHistoryImages = Math\.max\(0, 4 - currentUploaded/, 'web chat must preserve a bounded image context for follow-up questions');
          assert.match(desktopScript, /function renderAttachmentTray\(\)/, 'Windows app attachment tray must be wired');
          assert.match(desktopScript, /images:Array\.isArray\(images\)\?images:\[\]/, 'Windows CodePro/Breakaway routes must receive images');
          assert.match(mobileSource, /images:images/, 'mobile chat must send images to the gateway');
          assert.match(mobileSource, /id="attachImage"/, 'mobile chat must expose an image attach control');
          assert.match(mobileSource, /remainingHistoryImages=Math\.max\(0,4-images\.length\)/, 'mobile chat must bound image context across turns');
          assert.match(desktopScript, /remainingHistoryImages=Math\.max\(0,4-images\.length\)/, 'Windows chat must bound image context across turns');
          const mobileScriptStart = mobileHtml.indexOf('<script type="module">');
          const mobileScriptContentStart = mobileHtml.indexOf('>', mobileScriptStart) + 1;
          const mobileScriptEnd = mobileHtml.indexOf('</script>', mobileScriptContentStart);
          assert.ok(mobileScriptStart >= 0 && mobileScriptEnd > mobileScriptContentStart, 'mobile inline chat script must exist');
          fs.writeFileSync('/tmp/isaiah-mobile-check.mjs', mobileHtml.slice(mobileScriptContentStart, mobileScriptEnd));
          console.log('Google, Puter, shared-logo, response-status, and website/mobile/desktop Firebase config checks passed. Active Firebase project: ' + firebaseConfig.projectId);
          NODE
      - name: Syntax-check the mobile chat module
        run: node --check /tmp/isaiah-mobile-check.mjs

  live-super:
    name: Live streamed IsaiahAI 7.0 SUPER test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 3
    steps:
      - name: Test streamed model response
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://codepro-gateway-production.up.railway.app/api/chat';
          const controller = new AbortController();
          const hardTimeout = setTimeout(() => controller.abort(), 100000);
          const startedAt = Date.now();
          let firstByteMs = null;
          let accumulated = '';
          let completed = null;
          let sawThinking = false;
          let sawWriting = false;
          let buffer = '';

          const processFrame = (frame) => {
            const lines = frame.split(/\r?\n/);
            const eventName = lines.find((line) => line.startsWith('event:'))?.slice(6).trim();
            const dataText = lines.filter((line) => line.startsWith('data:')).map((line) => line.slice(5).trim()).join('\n');
            if (!dataText) return;
            const data = JSON.parse(dataText);
            if (eventName === 'status') {
              if (data.status === 'thinking') sawThinking = true;
              if (data.status === 'writing') sawWriting = true;
            } else if (eventName === 'delta') {
              accumulated += String(data.text || '');
            } else if (eventName === 'done') {
              completed = data;
            } else if (eventName === 'error') {
              throw new Error(data.message || 'The model returned a stream error.');
            }
          };

          try {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
              signal: controller.signal,
              body: JSON.stringify({
                model: 'isaiahai_7_super',
                selectedModel: 'isaiahai_7_super',
                message: 'Reply with exactly this text and nothing else: ISAIAHAI_7_SUPER_LIVE_OK',
                history: [],
                stream: true,
                reasoningMode: 'auto',
                reasoningEffort: 'low',
                showThinking: false
              })
            });

            if (!response.ok) throw new Error('Gateway HTTP ' + response.status + ': ' + await response.text());
            if (!response.headers.get('content-type')?.includes('text/event-stream')) {
              throw new Error('Gateway did not return a server-sent event stream.');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              if (firstByteMs === null) firstByteMs = Date.now() - startedAt;
              buffer = (buffer + decoder.decode(value, { stream: true })).replace(/\r\n/g, '\n');
              let splitAt;
              while ((splitAt = buffer.indexOf('\n\n')) !== -1) {
                const frame = buffer.slice(0, splitAt);
                buffer = buffer.slice(splitAt + 2);
                processFrame(frame);
              }
            }
            buffer += decoder.decode();
            if (buffer.trim()) processFrame(buffer);

            const answer = String(completed?.content || accumulated).trim();
            if (firstByteMs === null || firstByteMs > 8000) throw new Error('The chat did not open its stream promptly: ' + firstByteMs + 'ms');
            if (!completed) throw new Error('Stream closed without a done event.');
            if (completed.brand !== 'IsaiahAI 7.0 SUPER') throw new Error('Wrong model identity: ' + completed.brand);
            if (!answer) throw new Error('The selected model returned an empty answer.');
            if (!sawThinking || !sawWriting) throw new Error('Expected early thinking and writing status events were not both received.');
            console.log(JSON.stringify({
              passed: true,
              model: completed.brand,
              providerRoute: completed.model || 'gateway fallback',
              firstByteMs,
              totalMs: Date.now() - startedAt,
              characters: answer.length
            }, null, 2));
          } finally {
            clearTimeout(hardTimeout);
          }
          NODE

  live-breakaway:
    name: Live streamed Breakaway 1.0 route test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 3
    steps:
      - name: Test Breakaway through the same /api/chat route used by the website
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://codepro-gateway-production.up.railway.app/api/chat';
          const controller = new AbortController();
          const hardTimeout = setTimeout(() => controller.abort(), 110000);
          const startedAt = Date.now();
          let firstByteMs = null;
          let accumulated = '';
          let completed = null;
          let buffer = '';

          const processFrame = (frame) => {
            const lines = frame.split(/\r?\n/);
            const eventName = lines.find((line) => line.startsWith('event:'))?.slice(6).trim();
            const dataText = lines.filter((line) => line.startsWith('data:')).map((line) => line.slice(5).trim()).join('\n');
            if (!dataText) return;
            const data = JSON.parse(dataText);
            if (eventName === 'delta') accumulated += String(data.text || '');
            else if (eventName === 'done') completed = data;
            else if (eventName === 'error') throw new Error(data.message || 'Breakaway returned a stream error.');
          };

          try {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
              signal: controller.signal,
              body: JSON.stringify({
                model: 'breakaway_1_0',
                selectedModel: 'breakaway_1_0',
                message: 'Reply with a short greeting and identify yourself as Breakaway 1.0.',
                history: [],
                stream: true,
                reasoningMode: 'auto',
                reasoningEffort: 'low',
                showThinking: false
              })
            });
            if (!response.ok) throw new Error('Gateway HTTP ' + response.status + ': ' + await response.text());
            if (!response.headers.get('content-type')?.includes('text/event-stream')) throw new Error('Breakaway did not return an event stream.');

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              if (firstByteMs === null) firstByteMs = Date.now() - startedAt;
              buffer = (buffer + decoder.decode(value, { stream: true })).replace(/\r\n/g, '\n');
              let splitAt;
              while ((splitAt = buffer.indexOf('\n\n')) !== -1) {
                const frame = buffer.slice(0, splitAt);
                buffer = buffer.slice(splitAt + 2);
                processFrame(frame);
              }
            }
            buffer += decoder.decode();
            if (buffer.trim()) processFrame(buffer);

            const answer = String(completed?.content || accumulated).trim();
            if (!completed) throw new Error('Breakaway stream closed without a done event.');
            if (completed.brand !== 'Breakaway 1.0') throw new Error('Wrong model handler: ' + String(completed.brand || completed.selectedModel || 'no model identity'));
            if (completed.selectedModel !== 'breakaway_1_0') throw new Error('Wrong selected model: ' + String(completed.selectedModel));
            if (!answer) throw new Error('Breakaway returned an empty answer.');
            console.log(JSON.stringify({
              passed: true,
              model: completed.brand,
              provider: completed.selectedProvider || completed.provider || 'not specified',
              firstByteMs,
              totalMs: Date.now() - startedAt,
              characters: answer.length
            }, null, 2));
          } finally {
            clearTimeout(hardTimeout);
          }
          NODE
