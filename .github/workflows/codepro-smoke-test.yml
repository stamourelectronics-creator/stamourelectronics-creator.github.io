name: IsaiahAI multi-model live smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codepro-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-models:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check the shared gateway and model configuration
        shell: pwsh
        run: |
          $base = 'https://codepro-gateway-production.up.railway.app'
          $health = Invoke-RestMethod -Uri "$base/health" -TimeoutSec 20
          if (-not $health.ok -or -not $health.providerReady) {
            throw 'The shared gateway did not report a configured provider.'
          }
          foreach ($model in @('isaiah_5_3', 'isaiah_max_6_0', 'isaiahai_7_super', 'isaiah_codepro')) {
            if (-not $health.models.$model) {
              throw "Model readiness is false for $model."
            }
          }
          if ($health.model -ne 'gemini-3.8-flash') {
            throw "Unexpected active CodePro model: $($health.model)"
          }
          Write-Host ("Gateway online. CodePro provider: " + $health.provider + "; model: " + $health.model)

      - name: Test IsaiahAI 5.3 Flash, Max 6.0 and 7.0 SUPER with reasoning controls
        shell: pwsh
        run: |
          $base = 'https://codepro-gateway-production.up.railway.app'
          $models = @(
            @{ id = 'isaiah_5_3'; expected = 'gemini-3.5-flash-lite'; label = 'IsaiahAI 5.3 Flash' },
            @{ id = 'isaiah_max_6_0'; expected = 'gemini-3.8-flash'; label = 'Isaiah Max 6.0' },
            @{ id = 'isaiahai_7_super'; expected = 'gemini-3.8-flash'; label = 'IsaiahAI 7.0 SUPER' }
          )
          foreach ($model in $models) {
            $payload = @{
              message = 'Reply with the exact text MODEL_SMOKE_OK and nothing else.'
              history = @()
              model = $model.id
              selectedModel = $model.id
              systemInstruction = "You are $($model.label). For this connection test only, reply with the exact text MODEL_SMOKE_OK and nothing else."
              searchWebEnabled = $false
              reasoningMode = 'thinking'
              reasoningEffort = 'low'
            } | ConvertTo-Json -Depth 10 -Compress
            $result = Invoke-RestMethod -Method Post -Uri "$base/api/chat" -ContentType 'application/json' -Body $payload -TimeoutSec 100
            if ($result.selectedModel -ne $model.id) {
              throw "The gateway returned the wrong selected model for $($model.id)."
            }
            $allowedProviderModels = @($model.expected, 'gemini-3.5-flash')
            if ($result.model -notin $allowedProviderModels) {
              throw "The gateway routed $($model.id) to unexpected provider model $($result.model)."
            }
            if ([string]::IsNullOrWhiteSpace([string]$result.content)) {
              throw "The selected model returned an empty response for $($model.id)."
            }
            Write-Host ("Passed: " + $model.label + " via " + $result.model)
          }

      - name: Test IsaiahAI CodePro provider
        shell: pwsh
        run: |
          $base = 'https://codepro-gateway-production.up.railway.app'
          $payload = @{
            message = 'Reply with the exact text CODEPRO_SMOKE_OK and nothing else.'
            history = @()
            stream = $false
          } | ConvertTo-Json -Depth 8 -Compress
          # Deliberately no Authorization header: the client does not contain server credentials.
          $result = Invoke-RestMethod -Method Post -Uri "$base/api/chat" -ContentType 'application/json' -Body $payload -TimeoutSec 100
          if ([string]::IsNullOrWhiteSpace([string]$result.content) -or $result.brand -ne 'IsaiahAI CodePro') {
            throw 'CodePro did not return a valid branded response.'
          }
          if ($result.provider -ne 'Gemini') {
            throw "CodePro did not use Gemini. Actual provider: $($result.provider)"
          }
          Write-Host ("Passed: IsaiahAI CodePro via " + $result.model)
