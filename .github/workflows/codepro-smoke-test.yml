name: IsaiahAI multi-model live smoke test
# Verify every gateway model, streamed responses, and IsaiahSearch result pagination.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codepro-smoke-test.yml'
      - 'electron-agent/index.html'
      - 'public/mobile/index.html'
      - 'src/firebase-applet-config.json'
      - 'src/main.tsx'
      - 'src/components/BrowserView.tsx'
      - 'src/App.tsx'
      - 'src/lib/puterClient.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-models:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check the shared gateway and model configuration
        shell: pwsh
        run: |
          $base = 'https://codepro-gateway-production.up.railway.app'
          $health = Invoke-RestMethod -Uri "$base/health" -TimeoutSec 20
          if (-not $health.ok -or -not $health.providerReady) {
            throw 'The shared gateway did not report a configured provider.'
          }
          foreach ($model in @('isaiah_5_3', 'isaiah_max_6_0', 'isaiahai_7_super', 'open_isaiah', 'breakaway_1_0', 'isaiah_codepro')) {
            if (-not $health.models.$model) {
              throw "Model readiness is false for $model."
            }
          }
          Write-Host ("Gateway online. Current CodePro provider: " + $health.codeproProvider + "; model: " + $health.codeproModel)

      - name: Test all hosted website models with graceful fallback
        shell: pwsh
        run: |
          $base = 'https://codepro-gateway-production.up.railway.app'
          $allowedModels = @('gemini-3.5-flash-lite', 'gemini-3.8-flash', 'gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-2.5-flash')
          $models = @(
            @{ id = 'isaiah_5_3'; label = 'IsaiahAI 5.3 Flash' },
            @{ id = 'isaiah_max_6_0'; label = 'Isaiah Max 6.0' },
            @{ id = 'isaiahai_7_super'; label = 'IsaiahAI 7.0 SUPER' },
            @{ id = 'open_isaiah'; label = 'Open-Isaiah' }
          )
          $failures = @()
          foreach ($model in $models) {
            try {
              $payload = @{
                message = 'Reply with the exact text MODEL_SMOKE_OK and nothing else.'
                history = @()
                model = $model.id
                selectedModel = $model.id
                systemInstruction = "You are $($model.label). For this connection test only, reply with the exact text MODEL_SMOKE_OK and nothing else."
                searchWebEnabled = $false
                reasoningMode = 'thinking'
                reasoningEffort = 'low'
              } | ConvertTo-Json -Depth 10 -Compress
              $result = Invoke-RestMethod -Method Post -Uri "$base/api/chat" -ContentType 'application/json' -Body $payload -TimeoutSec 300
              if ($result.selectedModel -ne $model.id) {
                throw "The gateway returned selectedModel=$($result.selectedModel), expected $($model.id)."
              }
              if ($result.model -notin $allowedModels) {
                throw "Unexpected provider model $($result.model)."
              }
              if ([string]::IsNullOrWhiteSpace([string]$result.content)) {
                throw 'The selected model returned an empty response.'
              }
              Write-Host ("Passed: " + $model.label + " via " + $result.model)
            } catch {
              $failures += ($model.label + ': ' + $_.Exception.Message)
              Write-Warning ($model.label + ' failed: ' + $_.Exception.Message)
            }
          }
          if ($failures.Count -gt 0) {
            throw ("Model smoke tests failed: " + ($failures -join ' | '))
          }

      - name: Test streamed Gemini response parsing
        shell: pwsh
        run: |
          $base = 'https://codepro-gateway-production.up.railway.app'
          $payload = @{
            message = 'Reply with the exact text STREAM_SMOKE_OK and nothing else.'
            history = @()
            model = 'isaiah_5_3'
            selectedModel = 'isaiah_5_3'
            systemInstruction = 'For this connection test only, reply with the exact text STREAM_SMOKE_OK and nothing else.'
            stream = $true
            searchWebEnabled = $false
            reasoningMode = 'auto'
          } | ConvertTo-Json -Depth 8 -Compress
          $response = Invoke-WebRequest -Method Post -Uri "$base/api/chat" -ContentType 'application/json' -Body $payload -TimeoutSec 180
          $streamText = [string]$response.Content
          if ($response.StatusCode -ne 200 -or $streamText -notmatch 'event: delta' -or $streamText -notmatch 'event: done' -or $streamText -notmatch 'STREAM_SMOKE_OK') {
            Write-Host ("Stream HTTP status: " + $response.StatusCode + "; content type: " + $response.Headers['Content-Type'] + "; body length: " + $streamText.Length)
            Write-Host ($streamText.Substring(0, [Math]::Min(4000, $streamText.Length)))
            throw 'The Gemini stream did not deliver a complete, parseable delta and done event.'
          }
          Write-Host 'Passed: Gemini streaming returned delta and done events with the expected text.'

      - name: Test image understanding across hosted model routes
        shell: pwsh
        run: |
          $base = 'https://codepro-gateway-production.up.railway.app'
          $health = Invoke-RestMethod -Uri "$base/health" -TimeoutSec 20
          $imageData = 'data:image/png;base64,'
          $models = @(
            @{ id = 'isaiah_5_3'; label = 'IsaiahAI 5.3 Flash' },
            @{ id = 'isaiah_max_6_0'; label = 'Isaiah Max 6.0' },
            @{ id = 'isaiahai_7_super'; label = 'IsaiahAI 7.0 SUPER' },
            @{ id = 'open_isaiah'; label = 'Open-Isaiah' },
            @{ id = 'breakaway_1_0'; label = 'Breakaway 1.0' }
          )
          if ([int]$health.codeproGeminiCredentialCount -gt 0) {
            $models += @{ id = 'isaiah_codepro'; label = 'IsaiahAI CodePro' }
          } else {
            Write-Warning 'Skipped CodePro image vision: this environment reports no Gemini vision credentials for CodePro; text-only Groq/Cloudflare credentials cannot read images.'
          }
          $failures = @()
          foreach ($model in $models) {
            try {
              $payload = @{
                message = 'Inspect the attached image. What color is the large centered shape, and what color is the background?'
                model = $model.id
                selectedModel = $model.id
                history = @()
                images = @(@{
                  name = 'vision-smoke-test.png'
                  mimeType = 'image/png'
                  data = $imageData
                })
                searchWebEnabled = $false
                stream = $true
                systemInstruction = 'You are performing a visual perception check. Examine the attached image itself. Describe the centered shape and the background colors. Do not assume details from the text prompt.'
              } | ConvertTo-Json -Depth 12 -Compress
              $response = Invoke-WebRequest -Method Post -Uri "$base/api/chat" -ContentType 'application/json' -Body $payload -TimeoutSec 240
              $answer = ''
              $doneData = $null
              foreach ($frame in [regex]::Split([string]$response.Content, "\r?\n\r?\n")) {
                $frameLines = @($frame -split "\r?\n")
                $eventLine = $frameLines | Where-Object { $_ -like 'event:*' } | Select-Object -First 1
                $eventName = if ($eventLine) { $eventLine.Substring(6).Trim() } else { '' }
                $dataText = (($frameLines | Where-Object { $_ -like 'data:*' } | ForEach-Object { $_.Substring(5).Trim() }) -join [Environment]::NewLine)
                if (-not $dataText) { continue }
                $frameData = $dataText | ConvertFrom-Json
                if ($eventName -eq 'delta') {
                  $answer += [string]$frameData.text
                } elseif ($eventName -eq 'done') {
                  $doneData = $frameData
                  if ($frameData.content) { $answer = [string]$frameData.content }
                } elseif ($eventName -eq 'error') {
                  throw [string]$frameData.message
                }
              }
              if (-not $doneData) { throw 'The image chat stream closed without its done event.' }
              $lower = $answer.ToLowerInvariant()
              if ([string]::IsNullOrWhiteSpace($answer) -or $lower -notmatch 'red' -or $lower -notmatch 'blue') {
                throw "The streamed model did not identify both visible colors. Response: $($answer.Substring(0, [Math]::Min(300, $answer.Length)))"
              }
              if ($doneData.selectedModel -ne $model.id) {
                throw "The streamed gateway returned selectedModel=$($doneData.selectedModel), expected $($model.id)."
              }
              Write-Host ("Passed streamed image vision: " + $model.label + " | " + $answer.Substring(0, [Math]::Min(180, $answer.Length)))
            } catch {
              $failures += ($model.label + ': ' + $_.Exception.Message)
              Write-Warning ($model.label + ' image vision failed: ' + $_.Exception.Message)
            }
          }
          if ($failures.Count -gt 0) {
            throw ("Image vision checks failed: " + ($failures -join ' | '))
          }

      - name: Verify IsaiahSearch returns real result links and the next page
        shell: pwsh
        run: |
          $base = 'https://codepro-gateway-production.up.railway.app'
          $query = 'OpenAI'
          $firstBody = @{ query = $query; engine = 'isaiah'; safeSearch = 'Moderate' } | ConvertTo-Json -Compress
          $first = Invoke-RestMethod -Method Post -Uri "$base/api/quick-search-links" -ContentType 'application/json' -Body $firstBody -TimeoutSec 45
          $firstResults = @($first.results | Where-Object { $_.url -match '^https?://' })
          $firstUnique = @($firstResults | ForEach-Object { ([uri]$_.url).GetLeftPart([System.UriPartial]::Path).TrimEnd('/').ToLowerInvariant() } | Sort-Object -Unique)
          Write-Host ("IsaiahSearch first page: " + $firstUnique.Count + " unique destination links")
          if ($firstUnique.Count -lt 8) {
            throw "IsaiahSearch returned only $($firstUnique.Count) usable links on its first page."
          }
          $moreBody = @{ query = $query; engine = 'isaiah'; safeSearch = 'Moderate'; offset = 10 } | ConvertTo-Json -Compress
          $more = Invoke-RestMethod -Method Post -Uri "$base/api/more-search-links" -ContentType 'application/json' -Body $moreBody -TimeoutSec 45
          $moreResults = @($more.results | Where-Object { $_.url -match '^https?://' })
          $moreUnique = @($moreResults | ForEach-Object { ([uri]$_.url).GetLeftPart([System.UriPartial]::Path).TrimEnd('/').ToLowerInvariant() } | Sort-Object -Unique)
          $newLinks = @($moreUnique | Where-Object { $_ -notin $firstUnique })
          Write-Host ("IsaiahSearch next page: " + $newLinks.Count + " additional unique destination links")
          if ($newLinks.Count -lt 1) {
            throw 'IsaiahSearch pagination did not produce a new destination link.'
          }

      - name: Test IsaiahAI CodePro on its configured provider
        shell: pwsh
        run: |
          $base = 'https://codepro-gateway-production.up.railway.app'
          $health = Invoke-RestMethod -Uri "$base/health" -TimeoutSec 20
          if (-not $health.models.isaiah_codepro) {
            throw 'IsaiahAI CodePro is not configured on the shared gateway.'
          }
          $payload = @{
            message = 'Reply with the exact text CODEPRO_SMOKE_OK and nothing else.'
            history = @()
            model = 'isaiah_codepro'
            selectedModel = 'isaiah_codepro'
            stream = $true
          } | ConvertTo-Json -Depth 8 -Compress
          $response = Invoke-WebRequest -Method Post -Uri "$base/api/chat" -ContentType 'application/json' -Body $payload -TimeoutSec 360
          $streamText = [string]$response.Content
          if ($response.StatusCode -ne 200 -or $streamText -notmatch 'event: delta' -or $streamText -notmatch 'event: done' -or $streamText -notmatch 'CODEPRO_SMOKE_OK') {
            Write-Host ($streamText.Substring(0, [Math]::Min(4000, $streamText.Length)))
            throw 'CodePro did not return a complete streamed, branded response.'
          }
          Write-Host 'Passed: IsaiahAI CodePro returned a complete streamed response.'

      - name: Test Breakaway 1.0 with its configured fallback
        shell: pwsh
        run: |
          $base = 'https://codepro-gateway-production.up.railway.app'
          $health = Invoke-RestMethod -Uri "$base/health" -TimeoutSec 20
          if (-not $health.models.breakaway_1_0) {
            throw 'Breakaway 1.0 is not configured on the shared gateway.'
          }
          $payload = @{
            message = 'Reply with the exact text BREAKAWAY_SMOKE_OK and nothing else.'
            history = @()
            model = 'breakaway_1_0'
            selectedModel = 'breakaway_1_0'
            stream = $true
          } | ConvertTo-Json -Depth 8 -Compress
          $response = Invoke-WebRequest -Method Post -Uri "$base/api/breakaway" -ContentType 'application/json' -Body $payload -TimeoutSec 360
          $streamText = [string]$response.Content
          if ($response.StatusCode -ne 200 -or $streamText -notmatch 'event: delta' -or $streamText -notmatch 'event: done' -or $streamText -notmatch 'BREAKAWAY_SMOKE_OK') {
            Write-Host ($streamText.Substring(0, [Math]::Min(4000, $streamText.Length)))
            throw 'Breakaway 1.0 did not return a complete streamed response.'
          }
          Write-Host 'Passed: Breakaway 1.0 returned a complete streamed response.'
