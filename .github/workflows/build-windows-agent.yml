name: Build IsaiahSearch Desktop (Windows and Ubuntu)
on:
  push:
    branches: [main]
    paths:
      - 'electron-agent/**'
      - 'public/downloads/isaiahai-agent.html'
      - '.github/workflows/build-windows-agent.yml'
      - 'src/App.tsx'
  workflow_dispatch:
concurrency:
  group: isaiahsearch-desktop-release-v2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out IsaiahSearch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: electron-agent
        run: npm install
      - name: Validate source
        working-directory: electron-agent
        run: npm run check
      - name: Build Windows installer and portable app
        working-directory: electron-agent
        run: npm run dist:win
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: IsaiahSearch-Windows
          path: electron-agent/release/*
          if-no-files-found: error
          retention-days: 30

  build-ubuntu:
    name: Build Ubuntu x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out IsaiahSearch
        uses: actions/checkout@v4
      - name: Install Linux icon conversion utility
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: electron-agent
        run: npm install
      - name: Validate source
        working-directory: electron-agent
        run: npm run check
      - name: Build Ubuntu AppImage and Debian package
        working-directory: electron-agent
        run: npm run dist:linux
      - name: Upload Ubuntu release files
        uses: actions/upload-artifact@v4
        with:
          name: IsaiahSearch-Ubuntu
          path: electron-agent/release/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish combined Windows and Ubuntu release
    needs: [build-windows, build-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform release files
        uses: actions/download-artifact@v4
        with:
          pattern: IsaiahSearch-*
          path: release-assets
          merge-multiple: true
      - name: Publish downloads and updater manifests
        uses: softprops/action-gh-release@v2
        with:
          tag_name: isaiahsearch-browser-build-${{ github.run_number }}
          name: IsaiahSearch Desktop 1.6.12 · build ${{ github.run_number }}
          body: |
            IsaiahSearch Desktop 1.6.12 for Windows x64 and Ubuntu x64.

            Includes streamed AI responses across the hosted models, the IsaiahSearch browser, browser-aware agent tools enabled across every desktop model, approved project-file review/saving, and the optional IsaiahAI 26 Thinking model. All hosted models can request fixed read-only Windows system diagnostics without per-command approval, including OS, CPU, GPU, memory, disks, drivers, USB devices, installed applications, Defender status, battery, audio, processes, services, network adapters, and Windows updates. These requests run only app-defined queries as the current user; the models cannot supply arbitrary command text for unattended execution. Local command batches can contain up to 100 commands, including PowerShell/Bash pipelines and HTTP downloads. Validated command batches run sequentially without per-command approval as the signed-in user (never Administrator/root) and stop at the first failure. The selected working folder may be outside the project workspace, and explicit paths can access locations the user account can access, including Downloads. High-risk elevation, credential/secret access, remote shells, disk formatting, registry/security changes and system shutdown/restart remain blocked. File saves remain separately approval-gated. The desktop does not grant unrestricted mouse/keyboard or system-settings control. The Puter-powered model is unlocked only after the user signs in to their own Puter account. No model-provider API key is embedded in either installer.

            Windows: NSIS setup and portable executable.
            Ubuntu: AppImage (recommended for automatic updates) and Debian package. AppImage builds check GitHub Releases and install updates automatically. Debian package installations can be updated by installing the new .deb release.
          files: release-assets/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
