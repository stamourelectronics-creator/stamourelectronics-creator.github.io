name: Build IsaiahAI Agent for Windows
on:
  push:
    branches: [main]
    paths:
      - 'electron-agent/**'
      - 'public/downloads/isaiahai-agent.html'
      - '.github/workflows/build-windows-agent.yml'
  workflow_dispatch:

# Cancel stale builds so an older Windows package cannot publish after a newer source commit.
concurrency:
  group: windows-agent-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out IsaiahAI
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: electron-agent
        run: npm install
      - name: Validate desktop renderer and main-process JavaScript
        working-directory: electron-agent
        run: npm run check
      - name: Check hosted AI API availability
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $health = Invoke-RestMethod -Uri 'https://isaiahsearch.netlify.app/api/health' -TimeoutSec 12
            if ($health.aiConfigured) {
              Write-Host 'Hosted AI API is reachable and reports server-side AI credentials configured.'
            } else {
              Write-Warning 'Hosted AI API is reachable, but its server-side Gemini/OpenRouter keys are not configured.'
            }
          } catch {
            Write-Warning ('Hosted AI API health check failed: ' + $_.Exception.Message)
          }
      - name: Build Windows installer and portable EXE
        working-directory: electron-agent
        run: npm run dist
      - name: Upload Windows binaries as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsaiahAI-Agent-Windows
          path: electron-agent/release/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish downloadable release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: isaiahai-agent-build-${{ github.run_number }}
          name: IsaiahAI Agent Windows build ${{ github.run_number }}
          body: |
            IsaiahAI Agent Windows installer and portable executable.
            Includes IsaiahSearch-powered Chromium browsing and computer tools inside AI chat. File writes and commands require Windows approval.
            Cloud AI provider usage policies still apply.
          files: electron-agent/release/*
          make_latest: true
