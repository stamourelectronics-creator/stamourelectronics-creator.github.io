name: Build IsaiahSearch Browser for Windows
on:
  push:
    branches: [main]
    paths:
      - 'electron-agent/**'
      - 'public/downloads/isaiahai-agent.html'
      - '.github/workflows/build-windows-agent.yml'
      - 'src/App.tsx'
  workflow_dispatch:
concurrency:
  group: windows-isaiahsearch-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out IsaiahSearch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: electron-agent
        run: npm install
      - name: Validate browser and agent source
        working-directory: electron-agent
        run: npm run check
      - name: Verify CodePro production gateway
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $health = Invoke-RestMethod -Uri 'https://codepro-gateway-production.up.railway.app/health' -TimeoutSec 15
            if ($health.ok -and $health.groqConfigured -and $health.model -eq 'openai/gpt-oss-120b') {
              Write-Host 'IsaiahAI CodePro gateway is online and GPT-OSS-120B is configured.'
            } else {
              Write-Warning 'CodePro gateway responded but the expected model is not configured.'
            }
          } catch { Write-Warning ('CodePro health check failed: ' + $_.Exception.Message) }
      - name: Check hosted AI API availability
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $health = Invoke-RestMethod -Uri 'https://isaiahsearch.netlify.app/api/health' -TimeoutSec 12
            if ($health.aiConfigured) { Write-Host 'Hosted AI API is reachable and reports AI credentials configured.' }
            else { Write-Warning 'Hosted AI API is reachable, but server-side AI credentials are not configured.' }
          } catch { Write-Warning ('Hosted AI API health check failed: ' + $_.Exception.Message) }
      - name: Build Windows installer and portable browser
        working-directory: electron-agent
        run: npm run dist
      - name: Upload Windows binaries as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsaiahSearch-Windows
          path: electron-agent/release/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish downloadable Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: isaiahsearch-browser-build-${{ github.run_number }}
          name: IsaiahSearch Browser Windows build ${{ github.run_number }}
          body: |
            IsaiahSearch Browser for Windows x64.
            Full-window IsaiahSearch browser with native Chromium tabs and a built-in IsaiahAI CodePro agent powered by GPT-OSS-120B. CodePro can research, inspect the active page, and use the local Windows Shell Bridge for multi-step PowerShell/CMD workflows. Shell agent mode requires explicit opt-in, runs as the current Windows user, streams real command output, and separately confirms high-impact operations. The installer supports automatic GitHub release updates.
            AI availability depends on the configured hosted model providers.
          files: electron-agent/release/*
          make_latest: true
