name: Build IsaiahSearch Browser for Windows
on:
  push:
    branches: [main]
    paths:
      - 'electron-agent/**'
      - 'public/downloads/isaiahai-agent.html'
      - '.github/workflows/build-windows-agent.yml'
      - 'src/App.tsx'
  workflow_dispatch:
concurrency:
  group: windows-isaiahsearch-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out IsaiahSearch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: electron-agent
        run: npm install
      - name: Validate browser and agent source
        working-directory: electron-agent
        run: npm run check
      - name: Verify CodePro and Breakaway gateway
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $health = Invoke-RestMethod -Uri 'https://codepro-gateway-production.up.railway.app/health' -TimeoutSec 15
            if ($health.ok -and $health.providerReady) {
              if ($health.cloudflareTokenConfigured -and $health.model -eq '@cf/zai-org/glm-4.7-flash') {
                Write-Host 'CodePro gateway is online with Cloudflare Workers AI GLM-4.7-Flash configured.'
              } elseif ($health.groqFallbackConfigured) {
                Write-Host 'CodePro gateway is online with its Groq fallback. Cloudflare token is not configured.'
              }
              if ($health.breakawayConfigured) { Write-Host ('Breakaway 1.0 backup route is ready: ' + $health.breakawayModel) }
              else { Write-Warning 'Breakaway 1.0 backup route is not configured.' }
            } else {
              Write-Warning 'CodePro gateway responded but no AI provider is ready.'
            }
          } catch { Write-Warning ('CodePro gateway health check failed: ' + $_.Exception.Message) }
      - name: Check hosted AI API availability
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $health = Invoke-RestMethod -Uri 'https://isaiahsearch.netlify.app/api/health' -TimeoutSec 12
            if ($health.aiConfigured) { Write-Host 'Hosted AI API is reachable and reports AI credentials configured.' }
            else { Write-Warning 'Hosted AI API is reachable, but server-side AI credentials are not configured.' }
          } catch { Write-Warning ('Hosted AI API health check failed: ' + $_.Exception.Message) }
      - name: Build Windows installer and portable browser
        working-directory: electron-agent
        run: npm run dist
      - name: Upload Windows binaries as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsaiahSearch-Windows
          path: electron-agent/release/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish downloadable Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: isaiahsearch-browser-build-${{ github.run_number }}
          name: IsaiahSearch Browser Windows build ${{ github.run_number }}
          body: |
            IsaiahSearch Browser for Windows x64.
            Full-window IsaiahSearch browser with native tabs, live news cards, website favicons, and built-in IsaiahAI CodePro and Breakaway 1.0. CodePro uses Cloudflare Workers AI when configured and automatically falls back to Groq; Breakaway keeps Gemini primary and can use its separate Groq backup route when the hosted Gemini API is unavailable. The Windows Shell Bridge requires explicit opt-in, runs as the current Windows user, streams real command output, and separately confirms high-impact operations. The installer supports automatic GitHub release updates.
            AI availability depends on the configured hosted model providers.
          files: electron-agent/release/*
          make_latest: true
