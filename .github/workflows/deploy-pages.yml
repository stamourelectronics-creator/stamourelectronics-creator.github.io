# CI publication for the IsaiahAI static frontend.
name: Publish IsaiahAI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out IsaiahAI
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate hosted server and Netlify function source
        run: |
          npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --outfile=/tmp/isaiah-server-check.cjs
          npx esbuild netlify/functions/api.mts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/isaiah-netlify-api-check.mjs
      - name: Probe configured Netlify API domains
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const hosts = [
            'https://isaiahsearch.netlify.app',
            'https://isaiahai.netlify.app',
            'https://isaiah-ai-acel.netlify.app'
          ];
          for (const host of hosts) {
            try {
              const response = await fetch(host + '/api/health', { signal: AbortSignal.timeout(10000) });
              const body = await response.text();
              let health = null;
              try { health = JSON.parse(body); } catch {}
              console.log(host + ' -> HTTP ' + response.status +
                (health ? ' | aiConfigured=' + Boolean(health.aiConfigured) : ' | non-JSON response'));
              if (health) console.log('  service=' + String(health.service || 'unknown'));
            } catch (error) {
              console.log(host + ' -> unavailable: ' + String(error?.message || error));
            }
          }
          NODE
      - name: Build the GitHub Pages website
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'
          VITE_NETLIFY_IFRAME_WRAPPER: 'false'
          VITE_API_BASE_URL: 'https://isaiahsearch.netlify.app'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # One-time owner setup: Settings → Pages → Build and deployment → Source = GitHub Actions.
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
