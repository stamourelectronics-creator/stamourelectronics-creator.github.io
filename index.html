<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/isaiahai-logo.svg" />
    <link rel="apple-touch-icon" href="/isaiahai-logo.svg" />
    <link rel="search" type="application/opensearchdescription+xml" title="Isaiah Search" href="https://isaiahsearch.netlify.app/api/opensearch.xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IsaiahAI" />
    <meta name="theme-color" content="#090b13" />
    <title>IsaiahAI</title>
    <style>
      html,body,#root{margin:0;width:100%;min-height:100%;background:#090b13}
      #boot-screen{position:fixed;inset:0;display:grid;place-items:center;background:#090b13;color:#f4f4f5;font:500 14px system-ui,sans-serif;z-index:999999}
      #boot-screen .boot-card{display:flex;align-items:center;gap:10px;padding:14px 18px;border:1px solid #27272a;border-radius:14px;background:#111318;box-shadow:0 20px 60px #0008}
      #boot-screen .dot{width:8px;height:8px;border-radius:999px;background:#f59e0b;animation:pulse 1s infinite}
      #boot-error{display:none;max-width:520px;margin:24px;padding:24px;border:1px solid #7f1d1d;border-radius:16px;background:#180b0b;color:#fecaca;line-height:1.5}
      @keyframes pulse{50%{opacity:.35}}
    </style>
    <script>
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent) && !location.pathname.startsWith("/mobile")) {
        location.replace("/mobile/" + location.search + location.hash);
      }
      window.__isaiahBootFailed = function(message) {
        var screen = document.getElementById("boot-screen");
        if (!screen) return;
        var card = screen.querySelector(".boot-card");
        if (card) card.style.display = "none";
        var error = document.getElementById("boot-error");
        if (error) {
          error.style.display = "block";
          error.innerHTML = "<strong>IsaiahAI could not start.</strong><br>" +
            "The page loaded, but its application code did not start correctly. " +
            "Please refresh once. If this keeps happening, use the recovery button below.<br><br>" +
            "<button onclick=\"location.reload()\" style=\"padding:9px 13px;border:0;border-radius:9px;background:#f59e0b;color:#090b13;font-weight:700;cursor:pointer\">Reload IsaiahAI</button>";
        }
        console.error("[IsaiahAI boot]", message);
      };
    </script>
    <!-- Puter.js SDK for IsaiahAI Imagery 26. Its availability is optional and must not block app startup. -->
    <script src="https://js.puter.com/v2/" async></script>
  </head>
  <body>
    <div id="root">
      <div id="boot-screen">
        <div class="boot-card"><span class="dot"></span><span>Starting IsaiahAI…</span></div>
        <div id="boot-error"></div>
      </div>
    </div>
    <script type="module">
      import("/src/main.tsx")
        .catch(function(error) {
          if (window.__isaiahBootFailed) window.__isaiahBootFailed(error);
        });
    </script>
  </body>
</html>
