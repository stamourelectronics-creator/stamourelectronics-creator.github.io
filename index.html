<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/isaiahai-logo.svg" />
    <link rel="apple-touch-icon" href="/isaiahai-logo.svg" />
    <meta name="theme-color" content="#090b13" />
    <title>IsaiahAI</title>
    <style>
      html,body,#root{margin:0;width:100%;min-height:100%;background:#090b13}
      #boot-screen{position:fixed;inset:0;display:grid;place-items:center;background:#090b13;color:#f4f4f5;font:500 14px system-ui,sans-serif;z-index:999999}
      #boot-screen .boot-card{display:flex;align-items:center;gap:10px;padding:14px 18px;border:1px solid #27272a;border-radius:14px;background:#111318;box-shadow:0 20px 60px #0008}
      #boot-screen .dot{width:8px;height:8px;border-radius:999px;background:#f59e0b;animation:pulse 1s infinite}
      #boot-error{display:none;max-width:620px;margin:24px;padding:24px;border:1px solid #7f1d1d;border-radius:16px;background:#180b0b;color:#fecaca;line-height:1.5}
      #boot-detail{display:block;margin-top:12px;padding:10px;border-radius:10px;background:#090b13;color:#fca5a5;font:12px ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}
      @keyframes pulse{50%{opacity:.35}}
    </style>
    <script>
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent) && !location.pathname.startsWith("/mobile")) {
        location.replace("/mobile/" + location.search + location.hash);
      }
      window.__isaiahBootFailed = function(message) {
        var screen=document.getElementById("boot-screen"); if(!screen)return;
        var card=screen.querySelector(".boot-card"); if(card)card.style.display="none";
        var error=document.getElementById("boot-error"); if(!error)return;
        error.style.display="block";
        var detail=document.getElementById("boot-detail");
        if(detail)detail.textContent=String(message && (message.stack || message.message) || message || "Unknown startup error");
        console.error("[IsaiahAI boot]",message);
      };
      window.addEventListener("error",function(e){ if(e.error) window.__isaiahBootFailed(e.error); });
      window.addEventListener("unhandledrejection",function(e){ window.__isaiahBootFailed(e.reason || "Unhandled startup rejection"); });
    </script>
    <script src="https://js.puter.com/v2/" async></script>
  </head>
  <body>
    <div id="root">
      <div id="boot-screen">
        <div class="boot-card"><span class="dot"></span><span>Starting IsaiahAI…</span></div>
        <div id="boot-error">
          <strong>IsaiahAI could not start.</strong><br>
          The application code failed during startup.
          <div id="boot-detail"></div>
          <button onclick="location.reload()" style="margin-top:14px;padding:9px 13px;border:0;border-radius:9px;background:#f59e0b;color:#090b13;font-weight:700;cursor:pointer">Reload IsaiahAI</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
